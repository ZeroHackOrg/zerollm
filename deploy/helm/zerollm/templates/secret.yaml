apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zerollm.fullname" . }}
  labels:
    {{- include "zerollm.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range .Values.upstreams }}
  UPSTREAM_{{ upper (regexReplaceAll "[^A-Za-z0-9]" .id "_") }}_KEY: {{ required "upstream.apiKeyEnv (or key) required" (.key | default "") | quote }}
{{- end }}
{{- if .Values.auditSigning.privateKeyBase64 }}
  audit_signing_key.pem: {{ b64dec .Values.auditSigning.privateKeyBase64 | quote }}
{{- end }}
{{- with .Values.extraSecrets.files }}
  {{- toYaml . | nindent 2 }}
{{- end }}